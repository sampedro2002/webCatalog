<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar__inner">
            <a href="#" id="navHome" class="navbar__brand">Catalog</a>
            <ul class="navbar__links">
                <li><a href="#" id="navProducts" class="navbar__link navbar__link--active">Products</a></li>
                <li><a href="rick-morty.html" class="navbar__link">Rick and Morty</a></li>
            </ul>
        </div>
    </nav>

    <header class="topbar">
        <div class="topbar__inner">
            <h1 class="topbar__title">Product Catalog</h1>
            <div class="topbar__actions">
                <div class="search">
                    <input
                        type="search"
                        id="searchInput"
                        class="search__input"
                        placeholder="Search product by name..."
                        autocomplete="off"
                    >
                </div>
                <button id="btnNew" class="btn btn--primary">+ New product</button>
            </div>
        </div>
    </header>

    <main class="container">
        <p id="message" class="message" hidden></p>
        <section id="grid" class="grid"></section>
    </main>

    <div id="modalOverlay" class="modal-overlay" hidden>
        <div class="modal">
            <div class="modal__header">
                <h2 id="modalTitle">New product</h2>
                <button type="button" id="btnClose" class="modal__close" aria-label="Close">&times;</button>
            </div>
            <form id="productForm" novalidate>
                <input type="hidden" id="productId">

                <label class="field">
                    <span>Name</span>
                    <input type="text" id="name" required maxlength="120">
                </label>

                <label class="field">
                    <span>Description</span>
                    <textarea id="description" rows="3" maxlength="500"></textarea>
                </label>

                <div class="field-row">
                    <label class="field">
                        <span>Price</span>
                        <input type="number" id="price" required min="0" step="0.01">
                    </label>
                    <label class="field">
                        <span>Stock</span>
                        <input type="number" id="stock" required min="0" step="1">
                    </label>
                </div>

                <label class="field">
                    <span>Image URL (optional)</span>
                    <input type="url" id="imageUrl" placeholder="https://...">
                </label>

                <div class="modal__actions">
                    <button type="button" id="btnCancel" class="btn">Cancel</button>
                    <button type="submit" class="btn btn--primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="confirmOverlay" class="modal-overlay" hidden>
        <div class="modal modal--small">
            <div class="modal__header">
                <h2 id="confirmTitle">Confirm</h2>
                <button type="button" id="btnConfirmClose" class="modal__close" aria-label="Close">&times;</button>
            </div>
            <p id="confirmMessage" class="confirm__message"></p>
            <div class="modal__actions">
                <button type="button" id="btnConfirmCancel" class="btn">Cancel</button>
                <button type="button" id="btnConfirmAccept" class="btn btn--danger">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
