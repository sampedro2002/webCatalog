name: Suitest E2E
on:
  push:
    branches: [ pre-test, test ]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Read Suitest config
        run: |
          set -euo pipefail
          cfg=suitest.config.json
          db() { jq -r ".database.$1" "$cfg"; }
          {
            echo "API_URL=$(jq -r .baseUrl "$cfg")"
            echo "DB_HOST=$(db host)"
            echo "DB_PORT=$(db port)"
            echo "DB_NAME=$(db name)"
            echo "DB_USERNAME=$(db username)"
            echo "DB_PASSWORD=$(db password)"
            echo "DB_ADMIN_USERNAME=$(db adminUsername)"
            echo "DB_ADMIN_PASSWORD=$(db adminPassword)"
            echo "DB_URL=jdbc:postgresql://$(db host):$(db port)/$(db name)"
          } >> "$GITHUB_ENV"

      - name: Prepare test database
        run: |
          set -euo pipefail
          export PGPASSWORD="$DB_ADMIN_PASSWORD"
          # Admin role for the throwaway CI database, so permissions never block the tests
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_ADMIN_USERNAME" -v ON_ERROR_STOP=1 \
            -v dbname="$DB_NAME" -v dbuser="$DB_USERNAME" -v dbpass="$DB_PASSWORD" <<'SQL'
          CREATE ROLE :"dbuser" WITH LOGIN SUPERUSER CREATEDB CREATEROLE PASSWORD :'dbpass';
          CREATE DATABASE :"dbname" WITH ENCODING 'UTF8' OWNER :"dbuser";
          \c :"dbname"
          GRANT ALL ON SCHEMA public TO :"dbuser";
          SQL
          echo "Test database $DB_NAME is ready"

      - name: Backend unit tests and package
        working-directory: backend
        run: mvn -B package

      - name: Start backend
        working-directory: backend
        run: |
          java -jar target/*.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$API_URL/api/products" > /dev/null; then
              echo "API is up at $API_URL"
              exit 0
            fi
            sleep 2
          done
          echo "API did not start. Backend log:"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright API tests
        env:
          API_URL: ${{ env.API_URL }}
        run: npx playwright test e2e/api

      - name: Frontend syntax check (all JS files)
        run: |
          set -euo pipefail
          for file in frontend/js/*.js; do
            node --check "$file"
          done

      - name: Frontend tests (Rick and Morty API)
        run: node --test frontend/tests/rick-morty.test.cjs

      - name: Stop backend
        if: always()
        run: |
          if [ -n "${BACKEND_PID:-}" ]; then kill "$BACKEND_PID" || true; fi

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: ${{ runner.temp }}/backend.log
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore
